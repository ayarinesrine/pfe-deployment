apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: prod-services
  namespace: monitoring
labels:
  release: prometheus-stack  
spec:
  selector:
    matchLabels: {}  
  namespaceSelector:
    matchNames:
      - prod
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
