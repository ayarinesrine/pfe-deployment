---
- name: Backup and encrypt all secrets under secrets/ (with sops + age)
  hosts: localhost
  gather_facts: no

  tasks:
    - name: Lire le fichier age-key.txt décodé
      slurp:
        src: "../age-key.txt"
      register: age_key_raw

    - name: Extraire les lignes du fichier décodé
      set_fact:
        lines_decoded: "{{ (age_key_raw.content | b64decode).split('\n') }}"

    - name: Extraire la clé publique (2e ligne, nettoyage)
      set_fact:
        age_public_key: "{{ (lines_decoded[1] | default('')) | trim | regex_replace('^# public key:\\s*', '') }}"

    - name: Vérifier que la clé publique n'est pas vide
      fail:
        msg: "La clé publique age est vide ou introuvable."
      when: age_public_key == ''

    - name: Lister tous les fichiers YAML sous secrets/
      find:
        paths: "secrets"
        patterns: "*.yaml"
        recurse: yes
      register: found_secrets

    - name: Filtrer les fichiers non encore chiffrés (qui ne contiennent pas 'sops:' dans le contenu)
      shell: |
        if grep -q 'sops:' {{ item.path }}; then
          echo "encrypted"
        else
          echo "plain"
        fi
      loop: "{{ found_secrets.files }}"
      register: check_encrypted
      changed_when: false

    - name: Créer la structure de backup dans secrets_back/
      file:
        path: "{{ 'secrets_back/' + (item.item.path | regex_replace('^secrets/', '') | dirname) }}"
        state: directory
        mode: '0755'
      loop: "{{ check_encrypted.results }}"
      when: item.stdout == "plain"
      loop_control:
        label: "{{ item.item.path }}"

    - name: Faire un backup de chaque fichier non encore chiffré (.yaml.bak)
      copy:
        src: "{{ item.item.path }}"
        dest: "{{ 'secrets_back/' + (item.item.path | regex_replace('^secrets/', '') | regex_replace('\\.yaml$', '.yaml.bak')) }}"
        mode: '0644'
      loop: "{{ check_encrypted.results }}"
      when: item.stdout == "plain"
      loop_control:
        label: "{{ item.item.path }}"

    - name: Chiffrer chaque fichier non encore chiffré avec sops + age
      command: >
        sops --encrypt --age {{ age_public_key }} -i {{ item.item.path }}
      loop: "{{ check_encrypted.results }}"
      when: item.stdout == "plain"
      loop_control:
        label: "{{ item.item.path }}"
      register: sops_encrypt
      changed_when: sops_encrypt.rc == 0
