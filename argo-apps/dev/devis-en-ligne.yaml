apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devis-en-ligne-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ayarinesrine/pfe-deployment.git
    targetRevision: main
    path: helm-charts/backend/devis-en-ligne
    helm:
      valueFiles:
        - dev/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
