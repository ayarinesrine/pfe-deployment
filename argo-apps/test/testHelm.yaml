apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: testHelm-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ayarinesrine/pfe-deployment.git
    targetRevision: main
    path: helm-charts/backend/testHelm
    helm:
      valueFiles:
        - test/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
