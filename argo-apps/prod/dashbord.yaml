apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dashbord-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ayarinesrine/pfe-deployment.git
    targetRevision: main
    path: helm-charts/frontend/dashbord
    helm:
      valueFiles:
        - prod/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
