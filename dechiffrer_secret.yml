---
- name: Decrypt and apply all secret files with sops + age
  hosts: localhost
  gather_facts: no

  vars:
    secrets_dir: "secrets"
    age_key_path: "/mnt/hgfs/shared/age-key.txt"

  tasks:
    - name: Lire le fichier age-key.txt décodé
      slurp:
        src: "{{ age_key_path }}"
      register: age_key_raw
      no_log: true

    - name: Extraire la clé privée (3e ligne)
      set_fact:
        age_private_key: "{{ (age_key_raw.content | b64decode).split('\n')[2] | trim }}"
      no_log: true

    - name: Vérifier que la clé privée n'est pas vide
      fail:
        msg: "La clé privée age est vide ou introuvable."
      when: age_private_key == ''

    - name: Lister tous les fichiers YAML sous secrets/
      find:
        paths: "{{ secrets_dir }}"
        patterns: "*.yaml"
        recurse: yes
      register: found_secrets

    - name: Lire le contenu de chaque fichier pour détecter ceux chiffrés
      slurp:
        src: "{{ item.path }}"
      loop: "{{ found_secrets.files }}"
      register: slurped_files

    - name: Construire la liste des fichiers chiffrés
      set_fact:
        encrypted_files: >-
          {{
            slurped_files.results 
            | selectattr('content', 'defined') 
            | selectattr('content', 'string') 
            | selectattr('content', 'search', 'sops:')
            | map(attribute='item.path')
            | list
          }}

    - name: Debug (afficher la liste des fichiers chiffrés)
      debug:
        var: encrypted_files

    - name: Définir la liste des fichiers déchiffrés
      set_fact:
        decrypted_files: >-
          {{
            encrypted_files
            | map('regex_replace', '\\.yaml$', '-decrypted.yaml')
            | list
          }}

    - name: Déchiffrer chaque fichier chiffré dans -decrypted.yaml
      shell: |
        export SOPS_AGE_KEY="{{ age_private_key }}"
        sops --decrypt "{{ item }}" > "{{ item | regex_replace('\\.yaml$', '-decrypted.yaml') }}"
      loop: "{{ encrypted_files }}"
      register: decrypt_results
      failed_when: decrypt_results is failed
      changed_when: decrypt_results is succeeded

    - name: Appliquer les fichiers déchiffrés avec kubectl
      command: kubectl apply -f "{{ item }}"
      loop: "{{ decrypted_files }}"
      register: apply_results
      failed_when: apply_results is failed
      changed_when: apply_results is succeeded

    - name: Supprimer les fichiers déchiffrés après application
      file:
        path: "{{ item }}"
        state: absent
      loop: "{{ decrypted_files }}"
