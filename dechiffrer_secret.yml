- name: Decrypt and apply all secret files with sops + age
  hosts: localhost
  gather_facts: no

  vars:
    secrets_dir: "secrets"
    age_key_path: "/mnt/hgfs/shared/age-key.txt"

  tasks:
    - name: Lire le fichier age-key.txt décodé
      slurp:
        src: "{{ age_key_path }}"
      register: age_key_raw
      no_log: true

    - name: Extraire les lignes du fichier décodé
      set_fact:
        lines_decoded: "{{ (age_key_raw.content | b64decode).split('\n') }}"
      no_log: true

    - name: Extraire la clé privée (3e ligne, nettoyage)
      set_fact:
        age_private_key: "{{ (lines_decoded[2] | default('')) | trim }}"
      no_log: true

    - name: Vérifier que la clé privée n'est pas vide
      fail:
        msg: "La clé privée age est vide ou introuvable."
      when: age_private_key == ''

    - name: Lister tous les fichiers YAML sous secrets/
      find:
        paths: "{{ secrets_dir }}"
        patterns: "*.yaml"
        recurse: yes
      register: found_secrets

    - name: Lire le contenu des fichiers YAML pour filtrer ceux chiffrés
      slurp:
        src: "{{ item.path }}"
      loop: "{{ found_secrets.files }}"
      register: secrets_content

    - name: Filtrer les fichiers chiffrés (contenant 'sops:')
      set_fact:
        encrypted_files: "{{ encrypted_files | default([]) + [ item.item.path ] }}"
      loop: "{{ secrets_content.results }}"
      when: (item.content | b64decode).find('sops:') != -1

    - name: Définir les noms des fichiers déchiffrés correspondants
      set_fact:
        decrypted_files: >-
          {{
            encrypted_files | map('regex_replace', '^' + secrets_dir + '/', '') 
                            | map('regex_replace', '\\.yaml$', '-decrypted.yaml') 
                            | list
          }}

    - name: Déchiffrer les fichiers secrets chiffrés
      shell: |
        export SOPS_AGE_KEY='{{ age_private_key }}'
        sops --decrypt {{ item }} > {{ secrets_dir }}/{{ decrypted_files[loop.index0] }}
      loop: "{{ encrypted_files }}"
      register: sops_decrypt_result
      failed_when: sops_decrypt_result.rc != 0
      changed_when: sops_decrypt_result.rc == 0
      no_log: true

    - name: Appliquer les fichiers déchiffrés avec kubectl
      command: kubectl apply -f {{ secrets_dir }}/{{ item }}
      loop: "{{ decrypted_files }}"
      register: kubectl_result
      failed_when: kubectl_result.rc != 0
      changed_when: kubectl_result.rc == 0

    - name: Supprimer les fichiers déchiffrés après application (optionnel)
      file:
        path: "{{ secrets_dir }}/{{ item }}"
        state: absent
      loop: "{{ decrypted_files }}"
