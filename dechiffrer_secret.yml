- hosts: localhost
  gather_facts: false

  vars:
    secrets_dir: secrets

  tasks:
    - name: Trouver tous les fichiers YAML dans secrets/
      find:
        paths: "{{ secrets_dir }}"
        patterns: "*.yaml"
      register: found_files

    - name: Construire la liste des fichiers chiffrés (qui contiennent 'sops:')
      command: grep -l 'sops:' "{{ item.path }}"
      loop: "{{ found_files.files }}"
      register: grep_results
      ignore_errors: true

    - name: Extraire uniquement les fichiers chiffrés
      set_fact:
        encrypted_files: "{{ grep_results.results
          | selectattr('rc', 'eq', 0)
          | map(attribute='item.path')
          | list }}"

    - name: Debug (afficher la liste des fichiers chiffrés)
      debug:
        var: encrypted_files

    - name: Définir la liste des fichiers déchiffrés
      set_fact:
        decrypted_files: "{{ encrypted_files | map('regex_replace', '\\.yaml$', '-decrypted.yaml') | list }}"

    - name: Déchiffrer chaque fichier chiffré dans -decrypted.yaml
      shell: |
        export SOPS_AGE_KEY='{{ lookup("env", "SOPS_AGE_KEY") }}'
        sops -d "{{ item }}" > "{{ item | regex_replace('\\.yaml$', '-decrypted.yaml') }}"
      args:
        executable: /bin/bash
      loop: "{{ encrypted_files }}"
      when: encrypted_files | length > 0

    - name: Appliquer les fichiers déchiffrés avec kubectl
      shell: kubectl apply -f "{{ item }}"
      loop: "{{ decrypted_files }}"
      when: decrypted_files | length > 0

