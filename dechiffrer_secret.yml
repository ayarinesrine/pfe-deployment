---
- name: Decrypt secret file with sops + age (simple + sécurité)
  hosts: localhost
  gather_facts: no

  vars_prompt:
    - name: secret_file_name
      prompt: "Entrez le nom du fichier secret à déchiffrer (ex: test.yaml)"
      private: no

  tasks:
    - name: Lire le fichier age-key.txt décodé
      slurp:
        src: "/mnt/hgfs/shared/age-key.txt"
      register: age_key_raw

    - name: Extraire les lignes du fichier décodé
      set_fact:
        lines_decoded: "{{ (age_key_raw.content | b64decode).split('\n') }}"

    - name: Extraire la clé privée (3e ligne, nettoyage)
      set_fact:
        age_private_key: "{{ (lines_decoded[2] | default('')) | trim }}"

    - name: Vérifier que la clé privée n'est pas vide
      fail:
        msg: "La clé privée age est vide ou introuvable."
      when: age_private_key == ''

    - name: Vérifier si le fichier secret existe
      stat:
        path: "secrets/{{ secret_file_name }}"
      register: secret_file_stat

    - name: Échouer si le fichier secret n'existe pas
      fail:
        msg: "Le fichier secrets/{{ secret_file_name }} n'existe pas !"
      when: not secret_file_stat.stat.exists

    - name: Définir le nom du fichier déchiffré
      set_fact:
        decrypted_file_name: "{{ secret_file_name | regex_replace('\\.yaml$', '') }}-decrypted.yaml"

    - name: Déchiffrer le fichier secret avec sops dans le fichier -decrypted.yaml
      shell: |
        export SOPS_AGE_KEY='{{ age_private_key }}'
        sops --decrypt secrets/{{ secret_file_name }} > secrets/{{ decrypted_file_name }}
      register: sops_decrypt_result
      changed_when: sops_decrypt_result.rc == 0

    - name: Appliquer le fichier déchiffré avec kubectl
      command: kubectl apply -f secrets/{{ decrypted_file_name }}
      register: kubectl_result
      changed_when: kubectl_result.rc == 0
