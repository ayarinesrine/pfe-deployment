- name: Decrypt all secret files with sops + age and apply them
  hosts: localhost
  gather_facts: no

  vars:
    secrets_dir: "secrets"
    age_key_path: "/mnt/hgfs/shared/age-key.txt"

  tasks:
    - name: Lire le fichier age-key.txt décodé
      slurp:
        src: "{{ age_key_path }}"
      register: age_key_raw
      no_log: true

    - name: Extraire les lignes du fichier décodé
      set_fact:
        lines_decoded: "{{ (age_key_raw.content | b64decode).split('\n') }}"
      no_log: true

    - name: Extraire la clé privée (3e ligne, nettoyage)
      set_fact:
        age_private_key: "{{ (lines_decoded[2] | default('')) | trim }}"
      no_log: true

    - name: Vérifier que la clé privée n'est pas vide
      fail:
        msg: "La clé privée age est vide ou introuvable."
      when: age_private_key == ''

    - name: Lister tous les fichiers YAML sous secrets/
      find:
        paths: "{{ secrets_dir }}"
        patterns: "*.yaml"
        recurse: yes
      register: found_secrets

    - name: Lire le contenu des fichiers YAML pour filtrer ceux chiffrés
      slurp:
        src: "{{ item.path }}"
      loop: "{{ found_secrets.files }}"
      register: secrets_content

    - name: Filtrer les fichiers chiffrés (contenant 'sops:')
      set_fact:
        encrypted_files: "{{ encrypted_files | default([]) + [ item.item.path ] }}"
      loop: "{{ secrets_content.results }}"
      when: (item.content | b64decode).find('sops:') != -1

    - name: Déchiffrer, appliquer, et supprimer chaque fichier chiffré
      block:
        - name: Définir nom fichier déchiffré
          set_fact:
            decrypted_file_name: "{{ item | regex_replace('^' + secrets_dir + '/', '') | regex_replace('\\.yaml$', '') }}-decrypted.yaml"
          vars:
            item: "{{ item }}"

        - name: Déchiffrer avec sops dans fichier -decrypted.yaml
          shell: |
            export SOPS_AGE_KEY='{{ age_private_key }}'
            sops --decrypt {{ item }} > {{ secrets_dir }}/{{ decrypted_file_name }}
          register: sops_decrypt_result
          failed_when: sops_decrypt_result.rc != 0
          changed_when: sops_decrypt_result.rc == 0
          no_log: true

        - name: Appliquer le fichier déchiffré avec kubectl
          command: kubectl apply -f {{ secrets_dir }}/{{ decrypted_file_name }}
          register: kubectl_result
          failed_when: kubectl_result.rc != 0
          changed_when: kubectl_result.rc == 0

        - name: Supprimer le fichier déchiffré après application
          file:
            path: "{{ secrets_dir }}/{{ decrypted_file_name }}"
            state: absent

      loop: "{{ encrypted_files }}"
      when: encrypted_files is defined and encrypted_files | length > 0

    - name: Avertissement s'il n'y a aucun fichier chiffré à traiter
      debug:
        msg: "Aucun fichier secret chiffré trouvé dans {{ secrets_dir }}"
      when: encrypted_files is not defined or encrypted_files | length == 0
